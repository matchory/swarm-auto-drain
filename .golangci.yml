version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: all
  disable:
    # Need project-specific config; enable later with a real allowlist.
    - depguard
    - gomodguard
    # Not applicable to this codebase.
    - ginkgolinter
    - protogetter
    - rowserrcheck
    - sqlclosecheck
    - zerologlint
    - loggercheck
    # Overly restrictive in our judgement; revisit if patterns emerge.
    - ireturn
    # Conflicts with default Go idiom: `if err := f(); err != nil { ... }`.
    - noinlineerr
    # All three whitespace linters disagree with each other and the canonical
    # Go style; we prefer to let gofumpt own formatting.
    - nlreturn
    - wsl
    - wsl_v5
    # --- Style-policy linters disabled as too opinionated for this codebase ---
    # Pure style — comments-end-in-period. Not a defect signal.
    - godot
    # Subjective; fights idiomatic short names (i, r, w receivers, ip, mu, fn).
    # The receiver list under varnamelen.ignore-decls/names can't fully cover
    # the legitimate cases; net effect is noise.
    - varnamelen
    # Flags Unix permission literals (0o660) and HTTP status thresholds as
    # "magic numbers." Constants don't make these clearer.
    - mnd
    # Bans `fmt.Errorf("group %q has gid %d, want %d", ...)` in favour of
    # package-scoped sentinels. Useful when callers do `errors.Is`; the
    # human-readable one-shot errors here aren't compared.
    - err113
    # Dogmatic about wrapping every stdlib error. Already excluded for
    # project-internal calls (ignore-package-globs below); the remaining
    # findings are top-of-function `os.MkdirAll` / `os.Stat` where wrapping
    # adds the call's own name and nothing else.
    - wrapcheck
    # Enforces exported-before-unexported method ordering. Logical grouping
    # (receiver methods near each other in protocol order) beats this.
    - funcorder
    # Requires every struct field initialized at every literal. Conflicts
    # with Go's zero-value idiom (defaults are meaningful). The existing
    # per-type excludes here would need to grow indefinitely.
    - exhaustruct
    # Blanket-bans package globals. Test seams (var triggerNow = time.Now),
    # immutable lookup maps, and sentinel errors are legitimate; the
    # //nolint:gochecknoglobals churn dominates the signal.
    - gochecknoglobals
    # Named returns are a documented readability tool here.
    - nonamedreturns

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank intentionally off: `_ = foo()` already documents intent;
      # forcing nolint comments on every body.Close() is noise without signal.
      check-blank: false

    cyclop:
      max-complexity: 12
      package-average: 8

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 20

    gocyclo:
      min-complexity: 12

    nestif:
      min-complexity: 4

    maintidx:
      under: 20

    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
        - whyNoLint
        # Flags 176-byte Handlers value receiver. The struct is shared
        # across http.HandlerFunc methods and constructed once in main;
        # the "huge param" copy happens on a non-hot path (per-handler
        # registration), not per-request.
        - hugeParam

    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          arguments: [140]
        - name: function-length
          arguments: [60, 0]
        - name: cognitive-complexity
          arguments: [20]
        - name: cyclomatic
          arguments: [12]
        - name: max-public-structs
          disabled: true
        - name: add-constant
          disabled: true
        - name: unhandled-error
          disabled: true
        - name: package-comments
          disabled: true
        - name: file-header
          disabled: true
        - name: banned-characters
          disabled: true
        - name: argument-limit
          arguments: [6]
        - name: function-result-limit
          arguments: [4]

    govet:
      enable-all: true
      # fieldalignment fights the codebase's deliberate field ordering
      # (pointer/interface fields first to shrink the GC pointer-scan
      # window — search for "GC pointer-scan window" in the source). Pure
      # alignment-padding optimization isn't worth losing that signal.
      disable:
        - fieldalignment
      settings:
        shadow:
          # strict mode flags the idiomatic `if err := f(); err != nil`
          # pattern inside scopes that already declared `err`. Default
          # (non-strict) still catches the genuine shadowing bugs.
          strict: false

    gosec:
      severity: low
      confidence: low

    staticcheck:
      checks: ["all"]

    exhaustive:
      default-signifies-exhaustive: false

    misspell:
      locale: US

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    perfsprint:
      strconcat: true

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          env: upperSnake

    testifylint:
      enable-all: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # fieldalignment is cosmetic for test fixtures and rarely worth optimizing.
      - path: _test\.go
        text: 'fieldalignment'
        linters:
          - govet
      # Test files: relax the noisiest checks.
      - path: _test\.go
        linters:
          - bodyclose
          - containedctx
          - contextcheck
          - cyclop
          - dupl
          - errcheck
          - errchkjson
          - forcetypeassert
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - lll
          - maintidx
          - nestif
          - noctx
          - paralleltest
          - testpackage
          - thelper
          - tparallel
          - wsl_v5
      # Entrypoint: allow init wiring.
      - path: cmd/swarm-auto-drain/main\.go
        linters:
          - forbidigo
          - gochecknoinits
      # The OTel instrument-registration block in build() is intentionally
      # one-line-per-instrument for table-like legibility; the long lines
      # are descriptions, not logic.
      - path: internal/metrics/metrics\.go
        linters:
          - lll
      - path: internal/metrics/metrics\.go
        text: 'line-length-limit'
        linters:
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/matchory/swarm-auto-drain
    gofumpt:
      extra-rules: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
  sort-order:
    - file
    - linter
    - severity

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
