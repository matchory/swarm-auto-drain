# matchory supply chain baseline: matchory/.github supply-chain/templates/dependabot.yml
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: &schedule
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown: &cooldown
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups: &groups
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: gomod
    directory: /
    schedule: *schedule
    cooldown: *cooldown
    groups: *groups
    labels: [dependencies, go]
