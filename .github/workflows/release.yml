name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          out=dist/swarm-auto-drain-linux-${{ matrix.arch }}
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${out}" \
            ./cmd/swarm-auto-drain
          sha256sum "${out}" | awk '{print $1}' > "${out}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release.Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Stage binaries for buildx
        # release.Dockerfile expands ${TARGETARCH} to amd64/arm64;
        # copy the matrix outputs into the layout it expects so the
        # image ships the exact bits attached to the GitHub release.
        run: |
          mkdir -p binaries/linux/amd64 binaries/linux/arm64
          cp swarm-auto-drain-linux-amd64 binaries/linux/amd64/swarm-auto-drain
          cp swarm-auto-drain-linux-arm64 binaries/linux/arm64/swarm-auto-drain
          chmod +x binaries/linux/amd64/swarm-auto-drain binaries/linux/arm64/swarm-auto-drain

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/matchory/swarm-auto-drain
          # `stack` renders `image: ...:vX.Y.Z`, so the leading-`v`
          # semver tag must exist. Major/minor floats let operators
          # opt into auto-upgrades within a stable line; `latest`
          # tracks the newest tag.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage install.sh
        run: cp scripts/install.sh dist/install.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Released by .github/workflows/release.yml. See CHANGELOG/commit log for changes." \
            dist/*
