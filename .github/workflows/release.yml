name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No module/build cache: a published binary must not be built from a
      # cache another workflow could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out="dist/swarm-auto-drain-linux-${arch}"
            GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${out}" \
              ./cmd/swarm-auto-drain
          done
          (cd dist && sha256sum swarm-auto-drain-linux-* > SHA256SUMS)

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/swarm-auto-drain.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/swarm-auto-drain-linux-*

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/swarm-auto-drain-linux-*
          sbom-path: dist/swarm-auto-drain.spdx.json

      # The CHANGELOG section for this tag, or a pointer to the file when the
      # tag has none.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          [ -s "${RUNNER_TEMP}/notes.md" ] || echo "See CHANGELOG.md." > "${RUNNER_TEMP}/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --verify-tag --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" dist/*
